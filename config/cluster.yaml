---
apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: kubernetes
spec:
  hosts:
    - role: controller+worker
      noTaints: true
      ssh:
        address: 127.0.0.1
        keyPath: ${SSH_KEY_PATH}
        port: 22
        user: ${SSH_USERNAME}
      installFlags:
        - --kubelet-extra-args=--cgroup-driver=systemd
  k0s:
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: kubernetes
      spec:
        api:
          sans:
            - api.kubernetes.internal
            - localhost
            - 127.0.0.1
        network:
          provider: custom
          kubeProxy:
            disabled: true
        extensions:
          helm:
            charts:
              - name: cilium
                chartname: oci://registry-1.docker.io/sanselmechart/cilium
                namespace: kube-system
                order: 1
                version: 1.16.4
                values: |
                  k8sServiceHost: localhost
                  k8sServicePort: 6443
                  kubeProxyReplacement: true
                  ipam:
                    mode: kubernetes
                  gatewayAPI:
                    enabled: true
                    gatewayClass:
                      create: "true"
                    hostNetwork:
                      enabled: true
                  envoy:
                    prometheus:
                      enabled: true
                      serviceMonitor:
                        enabled: true
                    securityContext:
                      capabilities:
                        keepCapNetBindService: true
                        envoy:
                          - NET_ADMIN
                          - NET_BIND_SERVICE
                          - SYS_ADMIN
                  hubble:
                    metrics:
                      serviceMonitor:
                        enabled: true
                    relay:
                      prometheus:
                        enabled: true
                        serviceMonitor:
                          enabled: true
                  monitor:
                    enabled: true
                  operator:
                    replicas: 1
                    prometheus:
                      enabled: true
                      serviceMonitor:
                        enabled: true
                  prometheus:
                    enabled: true
                    serviceMonitor:
                      enabled: true
              - name: openebs
                chartname: oci://registry-1.docker.io/sanselmechart/openebs
                namespace: kube-system
                order: 2
                version: 3.10.0
                values: |
                  analytics:
                    enabled: false
                  localprovisioner:
                    hostpathClass:
                      isDefaultClass: true
                      name: standard
                    deviceClass:
                      enabled: false
                  ndm:
                    enabled: false
                  ndmOperator:
                    enabled: false
              - name: cert-manager
                chartname: oci://registry-1.docker.io/sanselmechart/cert-manager
                namespace: cert-manager
                order: 3
                version: v1.16.2
                values: |
                  crds:
                    enabled: true
                  config:
                    apiVersion: controller.config.cert-manager.io/v1alpha1
                    kind: ControllerConfiguration
                    enableGatewayAPI: true
              - name: ca-clusterissuer
                chartname: oci://registry-1.docker.io/sanselmechart/ca-clusterissuer
                namespace: cert-manager
                order: 3
                version: 0.2.0
                values: |
                  manifests:
                    clusterissuer: false
                    selfsigned: true
        telemetry:
          enabled: false
